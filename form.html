<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Product Review Form for WDD 131."
  >

  <meta name="author" content="Eze Oluebube">

  <title>Product Review | WDD 131</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Roboto:wght@400;500&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="styles/form.css">

  <script src="scripts/form.js" defer></script>
</head>

<body>

  <main class="container">

    <header class="page-header">
      <h1>Product Review</h1>
    </header>

    <form
      method="get"
      action="review.html"
      class="review-form"
    >

      <!-- PRODUCT NAME -->

      <div class="form-group">

        <label for="product">
          Product Name
          <span class="required">*</span>
        </label>

        <select
          id="product"
          name="product"
          required
        >

          <option
            value=""
            disabled
            selected
          >
            Select a Product ...
          </option>

        </select>

      </div>


      <!-- OVERALL RATING -->

      <fieldset class="form-group">

        <legend>
          Overall Rating
          <span class="required">*</span>
        </legend>

        <div class="rating-options">

          <label for="rating1">
            <span class="star">☆</span>
            <span>1</span>

            <input
              type="radio"
              id="rating1"
              name="rating"
              value="1"
              required
            >
          </label>


          <label for="rating2">
            <span class="star">☆</span>
            <span>2</span>

            <input
              type="radio"
              id="rating2"
              name="rating"
              value="2"
              required
            >
          </label>


          <label for="rating3">
            <span class="star">☆</span>
            <span>3</span>

            <input
              type="radio"
              id="rating3"
              name="rating"
              value="3"
              required
            >
          </label>


          <label for="rating4">
            <span class="star">☆</span>
            <span>4</span>

            <input
              type="radio"
              id="rating4"
              name="rating"
              value="4"
              required
            >
          </label>


          <label for="rating5">
            <span class="star">☆</span>
            <span>5</span>

            <input
              type="radio"
              id="rating5"
              name="rating"
              value="5"
              required
            >
          </label>

        </div>

      </fieldset>


      <!-- INSTALLATION DATE -->

      <div class="form-group">

        <label for="installDate">
          Date of Installation
          <span class="required">*</span>
        </label>

        <input
          type="date"
          id="installDate"
          name="installDate"
          required
        >

      </div>


      <!-- FEATURES -->

      <fieldset class="form-group features">

        <legend>
          Which features did you find useful?
        </legend>

        <p class="instructions">
          Check all that apply.
        </p>


        <label for="durability">

          <input
            type="checkbox"
            id="durability"
            name="features"
            value="Durability"
          >

          Durability

        </label>


        <label for="ease">

          <input
            type="checkbox"
            id="ease"
            name="features"
            value="Ease of Use"
          >

          Ease of Use

        </label>


        <label for="performance">

          <input
            type="checkbox"
            id="performance"
            name="features"
            value="Performance"
          >

          Performance

        </label>


        <label for="design">

          <input
            type="checkbox"
            id="design"
            name="features"
            value="Design"
          >

          Design

        </label>

      </fieldset>


      <!-- WRITTEN REVIEW -->

      <div class="form-group">

        <label for="review">
          Written Review
          <span class="optional">(Optional)</span>
        </label>

        <textarea
          id="review"
          name="review"
          rows="5"
        ></textarea>

      </div>


      <!-- USER NAME -->

      <div class="form-group">

        <label for="username">
          Your Name
          <span class="optional">(Optional)</span>
        </label>

        <input
          type="text"
          id="username"
          name="username"
          autocomplete="name"
        >

      </div>


      <!-- SUBMIT -->

      <input
        type="submit"
        value="Post Review"
        class="submit-button"
      >

    </form>

  </main>


  <footer>

    <p>
      &copy; <span id="currentYear"></span> Eze Oluebube
    </p>

    <p>
      WDD 131 &bull; Product Review Form
    </p>

    <p>
      Last Modification:
      <span id="lastModified"></span>
    </p>

  </footer>

</body>

</html>
